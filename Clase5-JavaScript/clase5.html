<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript I</title>
    <link rel="stylesheet" href="./css/clase5.css">
</head>

<body>

    <header>
        <h1>Aprendiendo JavaScript</h1>
        <p id="mensaje">JavaScript dará vida a esta página.</p>
    </header>

    <main>

        <section>
            <h2>Interacción</h2>
            <button id="btnSaludar">Saludar</button>
        </section>

        <section>
            <h2>Registro</h2>

            <form id="formRegistro">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre">

                <button type="submit">Registrar</button>
            </form>

            <p id="resultado"></p>
        </section>

    </main>

    <script src="./script.js"></script>
</body>

</html>
